apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llama-api-backend
  namespace: llama-platform
  labels:
    app: llama-api-backend
    release: prometheus # Important: matches Prometheus selector
spec:
  selector:
    matchLabels:
      app: llama-api-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
